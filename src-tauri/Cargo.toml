[package]
name = "riskmulator"
version = "0.2.2"
description = "Offline-first desktop training simulator for workplace risk management"
authors = ["RiskMulator Team"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "riskmulator_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# devtools: keep Inspect Element available in release builds until the
# product stabilizes — it is the only way to debug the WebView in the field.
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
